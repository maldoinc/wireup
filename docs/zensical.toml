[project.theme]
variant = "modern"
custom_dir = "overrides"
features = [
    "search.highlight",
    "navigation.sections",
    "content.code.annotate",
    "navigation.instant",
    "navigation.tabs",
    "navigation.indexes",
]

[project.theme.icon]
logo = "simple/wire"

[project.theme.font]
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "material/link", name = "Switch to light mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/toggle-switch", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle = { icon = "material/toggle-switch-off", name = "Switch to system preference" }

[project.markdown_extensions]
meta = {}
attr_list = {}
md_in_html = {}
admonition = {}
def_list = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.tasklist.custom_checkbox = true
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.mike]

[project.plugins.search]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = [".."]

[project.plugins.mkdocstrings.handlers.python.options]
group_by_category = true
show_category_heading = true
docstring_style = "sphinx"
show_source = false
filters = ["!^_", "^__init__$"]

[project.extra.version]
provider = "mike"
